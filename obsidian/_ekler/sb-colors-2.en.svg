<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" class="sb-svg" role="img" aria-label="While living an event, sense which colour you are in: new awareness is blue, self-judgement red, reconciliation yellow."><style>:root{--bg:#0e0c1d;--surface:#171432;--surface-2:#201c44;--line:#2e2957;--ink:#ece8f7;--muted:#a29fc0;--accent:#8f7bff;--on-accent:#0e0c1d;--violet:#b7a6ff;--good:#7fc28b;--danger:#e8806f;--warn:#e8a94a;--bad:#e2655f;--ok:#7fc28b;--orange:#f08a3c}</style><rect x="-50%" y="-50%" width="200%" height="200%" fill="#0e0c1d"/><g><circle cx="50" cy="64" r="20" fill="#6fa8ff" stroke="none" stroke-width="1.5" opacity="0.18"/><circle cx="50" cy="64" r="12.4" fill="#6fa8ff" stroke="none" stroke-width="1.5" opacity="0.27"/><circle cx="50" cy="64" r="6" fill="#6fa8ff" stroke="none" stroke-width="1.5" opacity="0.6"/></g><g><circle cx="50" cy="61" r="4.5" fill="none" stroke="#d9d3ff" stroke-width="1.2" opacity="1"/><rect x="48" y="65.5" width="4" height="3" rx="0.8" fill="none" stroke="#d9d3ff" stroke-width="1.2" opacity="1"/></g><text x="50" y="100" fill="#d9d3ff" font-size="7" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="500" text-anchor="middle" opacity="0.8">awareness</text><g><circle cx="120" cy="64" r="20" fill="#e2655f" stroke="none" stroke-width="1.5" opacity="0.18"/><circle cx="120" cy="64" r="12.4" fill="#e2655f" stroke="none" stroke-width="1.5" opacity="0.27"/><circle cx="120" cy="64" r="6" fill="#e2655f" stroke="none" stroke-width="1.5" opacity="0.6"/></g><g><ellipse cx="120" cy="60" rx="4.5" ry="6" fill="none" stroke="#d9d3ff" stroke-width="1.2" opacity="1"/><line x1="120" y1="66" x2="120" y2="69" stroke="#d9d3ff" stroke-width="1.2" stroke-linecap="round" opacity="1"/><line x1="117" y1="69" x2="123" y2="69" stroke="#d9d3ff" stroke-width="1.2" stroke-linecap="round" opacity="1"/></g><text x="120" y="100" fill="#d9d3ff" font-size="7" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-wei
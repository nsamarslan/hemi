<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" class="sb-svg" role="img" aria-label="'I am more than my physical body.' Feel awareness reaching past the body's edges; expand, experience, know."><style>:root{--bg:#0e0c1d;--surface:#171432;--surface-2:#201c44;--line:#2e2957;--ink:#ece8f7;--muted:#a29fc0;--accent:#8f7bff;--on-accent:#0e0c1d;--violet:#b7a6ff;--good:#7fc28b;--danger:#e8806f;--warn:#e8a94a;--bad:#e2655f;--ok:#7fc28b;--orange:#f08a3c}</style><rect x="-50%" y="-50%" width="200%" height="200%" fill="#0e0c1d"/><g><line x1="61" y1="115" x2="183" y2="115" stroke="#d9d3ff" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/><circle cx="70" cy="101" r="7.5" fill="#d9d3ff" stroke="none" stroke-width="1.5" opacity="1"/><line x1="81" y1="104" x2="127" y2="104" stroke="#d9d3ff" stroke-width="8" stroke-linecap="round" opacity="1"/><line x1="127" y1="104" x2="153" y2="102.5" stroke="#d9d3ff" stroke-width="5.5" stroke-linecap="round" opacity="1"/><line x1="153" y1="102.5" x2="177" y2="105" stroke="#d9d3ff" stroke-width="5" stroke-linecap="round" opacity="1"/><line x1="177" y1="105" x2="178" y2="97" stroke="#d9d3ff" stroke-width="3.5" stroke-linecap="round" opacity="1"/><line x1="93" y1="109" x2="121" y2="110" stroke="rgba(170,162,222,.95)" stroke-width="3.2" stroke-linecap="round" opacity="1"/></g><ellipse cx="120" cy="102" rx="70" ry="32" fill="none" stroke="#8f7bff" stroke-width="1.2" opacity="0.5" stroke-dasharray="3 5" class="sb-breathe"/><circle cx="120" cy="102" r="30" fill="none" stroke="#8f7bff" stroke-width="1.4" opacity="1" class="sb-ring" style="animation-delay:0.00s;animation-duration:3.2s"/><circle cx="120" cy="102" r="30" fill="none" stroke="#8f7bff" stroke-width="1.4" opacity="1" class="sb-ring" style="animation-delay:1.07s;animation-duration:3.2s"/><circle cx="120" cy="102" r="30" fill="none" stroke="#8f7bff" stroke-width="1.4" opacity="1" class="sb-ring" style="animation-delay:2.13s;animation-duration:3.2s"/><text x="36" y="40" fill